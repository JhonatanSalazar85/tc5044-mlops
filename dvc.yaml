# Pipeline MiBici - TC5044 Operaciones de aprendizaje automático
# Reproducir todo:        dvc repro
# Reproducir una etapa:   dvc repro limpiar
# Ver el grafo:           dvc dag
# Todos los parámetros se leen de params.yaml; el código vive en el paquete tc5044_mlops.

stages:

  descargar:
    cmd: python -m tc5044_mlops.dataset descargar --out data/raw/mibici
    deps:
      - tc5044_mlops/dataset.py
    params:
      - descargar.desde
      - descargar.hasta
    outs:
      - data/raw/mibici:
          persist: true     # no se borra entre corridas: la descarga es incremental
    # La fuente es remota y puede republicar meses; el manifiesto.json con los
    # MD5 queda dentro del out y es lo que fija qué bytes se usaron.

  consolidar:
    cmd: python -m tc5044_mlops.dataset consolidar --in data/raw/mibici --out data/interim/mibici_viajes.parquet
    deps:
      - tc5044_mlops/dataset.py
      - data/raw/mibici
    outs:
      - data/interim/mibici_viajes.parquet

  limpiar:
    cmd: python -m tc5044_mlops.limpieza
    deps:
      - tc5044_mlops/limpieza.py
      - data/interim/mibici_viajes.parquet
      - data/raw/mibici/nomenclatura
    params:
      - limpiar
    outs:
      - data/processed/mibici_viajes.parquet
    metrics:
      - reports/limpieza.json:
          cache: false

  features:
    cmd: python -m tc5044_mlops.features
    deps:
      - tc5044_mlops/features.py
      - data/processed/mibici_viajes.parquet
    params:
      - features
    outs:
      - data/processed/mibici_demanda_horaria.parquet

  train:
    cmd: python -m tc5044_mlops.modeling.train
    deps:
      - tc5044_mlops/pipeline.py
      - tc5044_mlops/modeling
      - data/processed/mibici_demanda_horaria.parquet
    params:
      - semilla
      - particion
      - pipeline
      - modelos
      - optuna
      - mlflow
    metrics:
      - reports/metricas_fase2.json:
          cache: false
