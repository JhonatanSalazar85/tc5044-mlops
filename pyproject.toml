[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tc5044_mlops"
version = "0.0.1"
description = "MLOps project for TC5044 - Operaciones de aprendizaje automatico (Tec de Monterrey)"
authors = [
  { name = "jhonatan_marin_A01797351" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["tc5044_mlops"]
include = ["pyproject.toml", "tc5044_mlops/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["tc5044_mlops"]
force-sort-within-sections = true

