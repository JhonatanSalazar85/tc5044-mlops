[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tc5044_mlops"
version = "0.0.1"
description = "MLOps project for TC5044 - Operaciones de aprendizaje automatico (Tec de Monterrey)"
authors = [
  { name = "jhonatan_marin_A01797351" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]


[tool.ruff]
line-length = 99
src = ["tc5044_mlops"]
include = ["pyproject.toml", "tc5044_mlops/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["tc5044_mlops"]
force-sort-within-sections = true


[tool.pytest.ini_options]
# Un solo comando ejecuta todas las pruebas: `pytest -q` (o `make test`).
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integracion: pruebas de extremo a extremo (CSV crudos -> métricas, API, contenedor)",
]
filterwarnings = [
    # Avisos de librerías de terceros que no indican errores del proyecto
    "ignore::DeprecationWarning",
    "ignore::FutureWarning:mlflow.*",
    "ignore:.*Inferred schema contains integer column.*:UserWarning",
    "ignore:.*Using `httpx` with `starlette.testclient`.*",
    "ignore:.*select_dtypes.*:UserWarning",
    "ignore:.*dataset source can be interpreted in multiple ways.*:UserWarning",
]
