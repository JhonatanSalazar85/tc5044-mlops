# Parámetros del proyecto MiBici (TC5044 - MLOps, Equipo 15)
# Única fuente de valores configurables: rutas, umbrales, hiperparámetros y semillas.
# Los módulos los leen con `tc5044_mlops.config.cargar_params()`; ningún valor
# de esta lista debe quedar escrito a mano dentro del código.
# Cambiar un valor aquí y correr `dvc repro` re-ejecuta solo lo que depende de él.

semilla: 42

descargar:
  desde: "2025-01"
  hasta: "2026-08"      # 2026-09 se reserva como conjunto de inferencia (Fase 3)

limpiar:
  # Umbrales de validez del viaje, en minutos.
  # < 1 min  : retiro cancelado (91 % de ellos devuelve en la misma estación)
  # > 1440   : bici no devuelta en 24 h
  duracion_min_valida: 1.0
  duracion_max_valida: 1440.0
  # Edad declarada por el usuario; fuera de rango se anula (no se borra la fila)
  edad_min_valida: 12
  edad_max_valida: 90

features:
  entrada: data/processed/mibici_viajes.parquet
  salida: data/processed/mibici_demanda_horaria.parquet
  top_estaciones: 50          # null = todas las estaciones (~472)
  lags_horas: [1, 2, 24, 168]  # 1 h, 2 h, mismo día anterior, misma hora de la semana anterior
  ventanas_moviles: [3, 24, 168]

particion:
  # Partición cronológica (nunca aleatoria): train < corte_val <= val < corte_test <= test
  corte_val: "2026-05-01"
  corte_test: "2026-07-01"

pipeline:
  objetivo: demanda
  col_estacion: origen_id
  col_hora: hora
  col_fin_semana: es_fin_semana
  numericas:
    - hora_sin
    - hora_cos
    - dia_sin
    - dia_cos
    - mes_sin
    - mes_cos
    - es_fin_semana
    - demanda_lag_1h
    - demanda_lag_2h
    - demanda_lag_24h
    - demanda_lag_168h
    - demanda_media_3h
    - demanda_media_24h
    - demanda_media_168h
  target_encoder_cv: 5
  pca_componentes: 3          # componentes del perfil horario de cada estación
  clusters_estaciones: 4      # solo para el análisis de tipos de uso (figura)

modelos:
  # Modelos candidatos y sus hiperparámetros de partida.
  baseline:
    columna: demanda_lag_168h     # "misma hora de la semana pasada"
    respaldo: demanda_media_24h
  ridge:
    alpha: 1.0
  poisson:
    alpha: 0.001
    max_iter: 300
  random_forest:
    n_estimators: 60
    max_depth: 12
    min_samples_leaf: 20
    max_samples: 0.3
  hgb:
    loss: poisson
    learning_rate: 0.1
    max_iter: 300
    max_leaf_nodes: 31
    min_samples_leaf: 40
    l2_regularization: 0.0

optuna:
  # Búsqueda de hiperparámetros del HistGradientBoosting (TPE)
  n_trials: 30
  timeout_seg: 1800
  fraccion_train: 1.0         # < 1.0 submuestrea el train para acelerar la búsqueda
  espacio:
    learning_rate: [0.02, 0.3]       # escala logarítmica
    max_iter: [100, 600]
    max_leaf_nodes: [15, 127]
    min_samples_leaf: [10, 200]
    l2_regularization: [0.000001, 10.0]  # escala logarítmica
    max_features: [0.5, 1.0]

mlflow:
  # La URI se puede sobrescribir con la variable de entorno MLFLOW_TRACKING_URI
  tracking_uri: sqlite:///mlflow.db
  experimento: mibici-demanda-fase2
  modelo_registrado: mibici-demanda-estacion-hora
  metrica_seleccion: val_mae   # menor es mejor

# ---------------------------------------------------------------------------
# Fase 3: exportación, servicio, reproducibilidad y monitoreo de drift
# ---------------------------------------------------------------------------
exportar:
  alias: champion               # alias del Model Registry que se empaqueta
  destino: models/champion      # carpeta autocontenida que viaja en la imagen (DVC)
  muestra_referencia: 2000      # filas de validación del "golden set" con su predicción esperada
  tolerancia: 1.0e-9            # diferencia máxima admitida al reproducir predicciones

api:
  titulo: "MiBici: demanda de retiros por estación y hora"
  version: "1.0.0"              # versión del servicio (etiqueta de la imagen)
  modelo_dir: models/champion   # la variable de entorno MODELO_DIR tiene prioridad
  max_registros: 5000           # filas máximas por petición a POST /predict
  zona_horaria: America/Mexico_City   # las horas con zona se convierten a hora local

drift:
  # Conjunto de referencia: validación (mayo-junio 2026), con el que se eligió el campeón.
  # Se monitorean los rezagos y medias móviles: las variables de calendario son
  # deterministas y cambian por diseño (otro mes = otro mes_sin), así que no se vigilan.
  columnas:
    - demanda_lag_1h
    - demanda_lag_2h
    - demanda_lag_24h
    - demanda_lag_168h
    - demanda_media_3h
    - demanda_media_24h
    - demanda_media_168h
  bins_psi: 10
  psi_aviso: 0.1                # PSI < 0.1 estable; 0.1-0.2 aviso; > 0.2 alerta
  psi_alerta: 0.2
  ks_alerta: 0.1                # estadístico KS (con n grande el p-valor siempre es ~0)
  fraccion_columnas_alerta: 0.3 # drift del dataset si >= 30 % de las columnas está en alerta
  nulos_alerta: 0.05            # aumento absoluto de la tasa de nulos de una columna
  inconsistencia_alerta: 0.05   # filas cuyo lag_1h no coincide con la demanda observada 1 h antes
  mae_aviso: 0.05               # MAE +5 % sobre la línea base (validación) -> aviso
  mae_alerta: 0.15              # MAE +15 % -> alerta de desempeño
  muestra_evidently: 20000      # filas por conjunto para el reporte HTML de Evidently
  salida: reports/drift
  experimento: mibici-monitoreo-fase3
  escenarios:
    desplazamiento_medias:      # error aguas arriba: la ingesta cuenta de más los retiros recientes
      columnas: [demanda_lag_1h, demanda_lag_2h, demanda_lag_24h, demanda_lag_168h,
                 demanda_media_3h, demanda_media_24h, demanda_media_168h]
      factor: 1.5
    features_faltantes:         # cae el feed en tiempo real: solo llegan los rezagos diarios
      columnas: [demanda_lag_1h, demanda_lag_2h, demanda_media_3h]
      fraccion: 1.0
    cambio_estacional:          # temporada de lluvias: tormentas por la tarde reducen el uso
      horas: [14, 20]
      factor: 0.55
    crecimiento_demanda:        # nuevas ciclovías o temporada alta: más viajes en todas las horas
      factor: 1.4
    severidad:                  # curva: desplazamiento de medias con factores crecientes
      factores: [1.0, 1.1, 1.2, 1.3, 1.5, 1.75, 2.0]
